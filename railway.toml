# Railway service configuration.
#
# Railway auto-detects the Dockerfile, but pinning it here makes the build
# explicit and wires the health check to the unauthenticated /health endpoint.
# Attach a Volume mounted at /workspace in the Railway dashboard (or via
# `railway volume`) so job checkouts persist across deploys and restarts.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
